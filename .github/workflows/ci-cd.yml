name: Scraper Bot CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force remote deployment on manual trigger'
        required: false
        type: boolean
        default: false

# Prevent concurrent runs on the same branch from colliding
concurrency:
  group: scraper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ============================================================================
  # 1. Code Quality & Linting Stage
  # ============================================================================
  lint:
    name: Lint & Code Style Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install Ruff Linter
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 🔍 Run Static Syntax & Integrity Checks
        run: |
          # Detect syntax errors, undefined variables, and broken imports
          ruff check . --select=E9,F63,F7,F82 --output-format=github

  # ============================================================================
  # 2. Automated Testing & AI Model Verification Stage
  # ============================================================================
  test:
    name: Unit & AI Pipeline Test Suite
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 🛠️ Install OpenCV & ONNX System Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            libgomp1

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Automated Smoke & Pipeline Tests
        run: |
          python -m unittest discover -s tests -v

  # ============================================================================
  # 3. Docker Build & Layer Verification Stage
  # ============================================================================
  docker-build:
    name: Docker Build & Image Verification
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ⚡ Build Docker Image with Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: raahcar-scraper-bot:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 4. Continuous Deployment Stage (VPS via SSH)
  # ============================================================================
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (inputs.force_deploy == true)

    steps:
      - name: 🚀 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          TARGET_DIR: ${{ secrets.SCRAPER_PROJECT_PATH || secrets.PROJECT_PATH }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 6579 }}
          envs: TARGET_DIR
          script: |
            set -e
            echo "🚀 [CI/CD] Starting Raahcar Scraper Bot deployment..."

            if [ -z "$TARGET_DIR" ]; then
              echo "❌ Error: Target project directory secret (SCRAPER_PROJECT_PATH or PROJECT_PATH) is not set!"
              exit 1
            fi

            # Seamless support: Standalone repo path OR monorepo subfolder
            if [ -d "$TARGET_DIR/scraper_bot" ]; then
              DEPLOY_PATH="$TARGET_DIR/scraper_bot"
            else
              DEPLOY_PATH="$TARGET_DIR"
            fi

            echo "📂 Deploying in: $DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            echo "📥 Fetching latest commits from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            # Ensure .env configuration exists
            if [ ! -f .env ]; then
              echo "⚙️ .env not found. Copying template from .env.example..."
              cp .env.example .env
            fi

            echo "🐳 Building containers & recreating updated services..."
            docker compose build --pull
            docker compose up -d --remove-orphans

            echo "🧹 Pruning dangling docker images to preserve VPS disk..."
            docker image prune -f

            echo "🔍 Verifying running container health status..."
            docker compose ps

            echo "🎉 [CI/CD] Scraper Bot deployment completed successfully!"

